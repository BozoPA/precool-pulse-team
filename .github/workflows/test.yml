name: Test PreCool Pulse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest tests -q

      - name: Exercise command-line simulation
        run: |
          python -m precool_pulse list
          python -m precool_pulse run blockage --seed 1 --out outputs
          python -m precool_pulse all --out outputs

      - name: Check Streamlit dashboard starts
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health > /tmp/streamlit-health.txt 2>/dev/null; then
              cat /tmp/streamlit-health.txt
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          echo "Streamlit did not become healthy within 45 seconds"
          exit 1
